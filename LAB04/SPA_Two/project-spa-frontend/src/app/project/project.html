<h1>Project List</h1>

<table class="table table-striped table-bordered mt-3">
  <thead>
    <tr>
      <th>Name</th>
      <th>Due Date</th>
      <th>Course</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let project of projects">
      <td>{{ project.name }}</td>
      <td>{{ project.dueDate | date }}</td>
      <td>{{ project.course }}</td>
      <td>
        <button class="btn btn-info btn-sm" (click)="selectProject(project)">Edit</button>
        <button class="btn btn-danger btn-sm ms-2" (click)="deleteProject(project._id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<hr class="mt-4">

<h2>Add / Edit Project</h2>

<div style="max-width: 300px;">

  <div class="mb-3">
    <label>Name:</label>
    <input class="form-control" [(ngModel)]="name">
  </div>

  <div class="mb-3">
    <label>Due Date:</label>
    <input type="date" class="form-control" [(ngModel)]="dueDate">
  </div>

  <div class="mb-3">
    <label>Course:</label>
    <input class="form-control" [(ngModel)]="course">
  </div>

  <!-- SAVE / UPDATE BUTTONS -->
  <button *ngIf="!_id" class="btn btn-primary" (click)="addProject()">Save New</button>

  <button *ngIf="_id" class="btn btn-success" (click)="updateProject()">Update</button>
  <button *ngIf="_id" class="btn btn-secondary ms-2" (click)="clearForm()">Cancel</button>

</div>
